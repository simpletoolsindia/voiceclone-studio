[package]
name = "voiceclone-studio"
version = "0.1.1"
description = "Open-source voice cloning, Tamil text-to-speech, live voice conversion and story video studio"
authors = ["VoiceClone Studio contributors"]
license = "GPL-3.0-or-later"
edition = "2021"
rust-version = "1.80"

[lib]
name = "voiceclone_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio-tungstenite = "0.24"
futures-util = "0.3"
cpal = "0.15"
uuid = { version = "1", features = ["v4"] }
rand = "0.8"
anyhow = "1"
regex = "1"
once_cell = "1"
dirs = "5"
base64 = "0.22"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
